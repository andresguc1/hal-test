services:
  hal-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hal-test-app
    network_mode: host
    volumes:
      - hal-test-storage:/app/apps/backend/storage
    environment:
      - NODE_ENV=production
      - PORT=2001
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - HALTEST_MASTER_ENCRYPTION_KEY=${HALTEST_MASTER_ENCRYPTION_KEY}
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  hal-test-storage:
    name: hal_test_data

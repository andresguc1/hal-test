name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Restrictive permissions per OSHF Scorecard recommendation
permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@1769ed05b9f39e9906194499b5c2b0bf8535a69b
    - uses: actions/setup-node@60edb5dd545a775178f192cb99c9b2d8661c5e89
      with:
        node-version: lts/*
    - name: Install dependencies
      run: pnpm install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@5d5d22a31266ced268874388604861cf4f7985a4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

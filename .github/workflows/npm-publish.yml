# LEGACY — Publishing to npm now happens exclusively through `release.yml`
# (tag push v* or manual workflow_dispatch). This workflow is kept only as a
# read-only CI gate on main. It intentionally does NOT publish to npm.
#
# Migration to npm Trusted Publishing (OIDC):
#   - Remove NPM_TOKEN secret usage for publishing.
#   - The single publish path lives in release.yml.
name: Publish haltest to npm (legacy gate)

on:
  push:
    branches:
      - main
    paths:
      - "apps/cli/package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build

      - name: Verify dist metadata
        run: |
          node -e "const p=require('./apps/cli/dist/package.json'); if(!p.repository) throw new Error('dist/package.json missing repository'); console.log('✓ dist/package.json repository:', p.repository.url)"

      - name: Clean-room test of npm package
        run: node scripts/clean-room-test.js

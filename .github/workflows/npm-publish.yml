name: Publish haltest to npm

on:
  push:
    branches:
      - main
    paths:
      - 'apps/cli/package.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint:fix

      - name: Test
        run: pnpm test
        env:
          NODE_ENV: test
          AUTH_ENABLED: 'false'
          VITE_AUTH_ENABLED: 'false'

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: cd apps/cli/dist && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

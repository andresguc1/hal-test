name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger

env:
  NODE_VERSION: '20'

jobs:
  # ========================================
  # JOB 1: Linting & Testing
  # ========================================
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🔍 Run ESLint
        run: pnpm run lint
        continue-on-error: true # Don't fail build on lint errors (for now)

      - name: 🎨 Check Prettier formatting
        run: pnpm exec prettier --check "**/*.{js,jsx,json,md}"
        continue-on-error: true

      - name: 🧪 Run backend tests
        run: cd apps/backend && pnpm test
        continue-on-error: true # Don't fail build on test errors (for now)

  # ========================================
  # JOB 2: Build Verification
  # ========================================
  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🏗️ Build Monolith
        run: pnpm run build:monolith

  # ========================================
  # JOB 3: Deploy to Production
  # ========================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Trigger Render Deploy
        run: |
          echo "Render auto-deploys on push to main"
          echo "Public URL: https://hal-test-backend.onrender.com"
          echo "App Dashboard: https://hal-test-backend.onrender.com/app/"

      - name: ⏳ Wait for deployments
        run: sleep 60 # Give services time to deploy

      - name: 🏥 Health check
        run: |
          echo "Checking application health..."
          curl -f https://hal-test-backend.onrender.com/api/status || exit 1

      - name: ✅ Deployment successful
        run: |
          echo "::notice::✅ Deployment completed successfully!"
          echo "Production URL: https://hal-test-backend.onrender.com"

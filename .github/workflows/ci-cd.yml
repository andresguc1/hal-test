name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger

env:
  NODE_VERSION: '22'

# Restrictive permissions per OSHF Scorecard recommendation
permissions:
  contents: read

jobs:
  # ========================================
  # JOB 1: Linting & Testing
  # ========================================
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@1769ed05b9f39e9906194499b5c2b0bf8535a69b

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@dc9f519e47a8b796aa19d9a9e5a5f11b696d5e8c
        with:
          version: 9.15.4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f192cb99c9b2d8661c5e89
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: 🔍 Run ESLint
        run: pnpm run lint

      - name: 🎨 Check Prettier formatting
        run: pnpm exec prettier --check "**/*.{js,jsx,json,md}"

      - name: 🛡️ Audit Dependencies
        run: pnpm audit --prod

      - name: 🧪 Run backend tests
        run: cd apps/backend && pnpm test
        env:
          NODE_ENV: test
          AUTH_ENABLED: 'false'
          VITE_AUTH_ENABLED: 'false'

      - name: 🧪 Run frontend tests
        run: cd apps/frontend && pnpm test
        env:
          NODE_ENV: test

  # ========================================
  # JOB 2: Build Verification
  # ========================================
  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@1769ed05b9f39e9906194499b5c2b0bf8535a69b

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@dc9f519e47a8b796aa19d9a9e5a5f11b696d5e8c
        with:
          version: 9.15.4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f192cb99c9b2d8661c5e89
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Monolith
        run: pnpm run build:monolith

      - name: 📋 Generate Release Metadata
        run: node scripts/generate-release-metadata.js
        env:
          BUILD_ID: ${{ github.run_id }}

  # ========================================
  # JOB 3: Database Migration Test
  # ========================================
  migration-test:
    name: 🗄️ Migration Test
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@1769ed05b9f39e9906194499b5c2b0bf8535a69b

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@dc9f519e47a8b796aa19d9a9e5a5f11b696d5e8c
        with:
          version: 9.15.4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f192cb99c9b2d8661c5e89
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Test SQLite migrations (fresh DB)
        run: |
          cd apps/backend
          DB_FORCE_MIGRATE=true pnpm db:migrate
          pnpm db:migrate:status

      - name: 🗄️ Test migration idempotency (run again)
        run: |
          cd apps/backend
          pnpm db:migrate
          pnpm db:migrate:status

      - name: 🗄️ Test rollback
        run: |
          cd apps/backend
          pnpm db:rollback 1
          pnpm db:migrate:status
          pnpm db:migrate
          pnpm db:migrate:status

  # ========================================
  # JOB 3: Deploy to Production
  # ========================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@1769ed05b9f39e9906194499b5c2b0bf8535a69b

      - name: 🚀 Trigger Render Deploy
        run: |
          echo "Render auto-deploys on push to main"
          echo "Public URL: https://haltest.com"
          echo "App Dashboard: https://haltest.com/app/"

      - name: ⏳ Wait for deployments & 🏥 Health check
        run: |
          echo "Checking application health (polling for up to 5 minutes)..."
          max_retries=30
          count=0
          until curl -f -s https://haltest.com/api/status > /dev/null; do
            count=$((count+1))
            if [ $count -ge $max_retries ]; then
              echo "Health check failed after 5 minutes."
              exit 1
            fi
            echo "Waiting for Render to finish deploy... (Attempt $count/$max_retries)"
            sleep 10
          done
          echo "Application is up and healthy!"

      - name: ✅ Verify Release Metadata in Production
        run: |
          echo "Verifying release metadata matches build..."
          RESPONSE=$(curl -s https://haltest.com/api/status)
          echo "$RESPONSE" | jq '.'
          BUILD_COMMIT="${{ github.sha }}"
          DEPLOY_COMMIT=$(echo "$RESPONSE" | jq -r '.git.commit')
          if [ "$BUILD_COMMIT" != "$DEPLOY_COMMIT" ]; then
            echo "⚠️ WARNING: Deploy commit ($DEPLOY_COMMIT) does not match build commit ($BUILD_COMMIT)"
          else
            echo "✅ Deploy commit matches build commit"
          fi

      - name: ✅ Deployment successful
        run: |
          echo "::notice::✅ Deployment completed successfully!"
          echo "Production URL: https://haltest.com"
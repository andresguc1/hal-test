name: Blog Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/blog/**"
  workflow_dispatch:

concurrency:
  group: blog-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 📝 Build Blog
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-check.outputs.pages_enabled }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: 📥 Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🔍 Astro check
        run: pnpm --filter @halt-test/blog run lint

      - name: 🏗️ Build static site
        run: pnpm --filter @halt-test/blog build

      - name: 🧭 Check GitHub Pages availability
        id: pages-check
        run: |
          if gh api "repos/${{ github.repository }}/pages" -q '.html_url' >/dev/null 2>&1; then
            echo "pages_enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ GitHub Pages is enabled"
          else
            echo "pages_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for this repository. Skipping publish steps (build still verified)."
          fi

      - name: 📤 Configure Pages
        if: steps.pages-check.outputs.pages_enabled == 'true'
        uses: actions/configure-pages@v5

      - name: 📦 Upload Pages artifact
        if: steps.pages-check.outputs.pages_enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/blog/dist

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
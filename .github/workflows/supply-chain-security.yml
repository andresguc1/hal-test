name: Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  # ========================================
  # JOB 1: Dependency Review
  # ========================================
  dependency-review:
    name: 🔍 Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Review Dependencies
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  # ========================================
  # JOB 2: Signed Commits Verification
  # ========================================
  verify-signatures:
    name: 🔐 Verify Signed Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Verify commit signatures
        run: |
          echo "Verifying commit signatures..."
          # Check if all commits in the range are signed
          COMMITS=$(git log --pretty=format:"%H" --no-merges ${{ github.event.before }}..${{ github.sha }} 2>/dev/null || git log --pretty=format:"%H" --no-merges -1 ${{ github.sha }})

          if [ -z "$COMMITS" ]; then
            echo "No new commits to verify"
            exit 0
          fi

          UNSIGNED=0
          for commit in $COMMITS; do
            if ! git verify-commit $commit 2>/dev/null; then
              echo "⚠️ Unsigned commit: $commit"
              git log -1 --format="%h %s (%an)" $commit
              UNSIGNED=$((UNSIGNED+1))
            else
              echo "✅ Signed commit: $commit"
            fi
          done

          if [ $UNSIGNED -gt 0 ]; then
            echo "::warning::$UNSIGNED commit(s) are not GPG-signed. Signature check is advisory only."
          fi

          echo "✅ Signature check complete (advisory)"

  # ========================================
  # JOB 3: SBOM Generation (All Artifacts)
  # ========================================
  generate-sbom:
    name: 📦 Generate SBOMs (All Artifacts)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📥 Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 📦 Generate all SBOMs
        run: node scripts/generate-sbom.js all

      - name: 📤 Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-all-artifacts
          path: sbom-output/
          retention-days: 30

  # ========================================
  # JOB 4: SLSA Provenance (Build Attestation)
  # ========================================
  slsa-provenance:
    name: 🏗️ SLSA Provenance (Build)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📥 Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build all artifacts
        run: pnpm run build:monolith && pnpm build

      - name: 📋 Generate SLSA Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            pnpm-lock.yaml
            apps/backend/public/**

  # ========================================
  # JOB 5: SLSA Provenance (Release Attestation)
  # ========================================
  slsa-provenance-release:
    name: 📦 SLSA Provenance (Release)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: generate-sbom
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sbom-all-artifacts
          path: sbom-output

      - name: 📦 Generate Release Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            sbom-output/**

      - name: 📤 Upload Release Provenance
        uses: actions/upload-artifact@v4
        with:
          name: slsa-release-provenance
          path: slsa-provenance-release.intoto.jsonl
          retention-days: 90

  # ========================================
  # JOB 6: Security Audit & Audit CI
  # ========================================
  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📥 Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🛡️ Run pnpm audit
        run: pnpm audit --prod --json > audit-results.json || true

      - name: ✨ Convert audit report to SARIF
        run: node scripts/audit-to-sarif.js audit-results.json audit-results.sarif

      - name: 📊 Upload Audit Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: audit-results.sarif
          category: pnpm-audit

      - name: 🔍 Run OSSF Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif

      - name: 📤 Upload Scorecard Results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
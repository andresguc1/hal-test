name: Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  # ========================================
  # JOB 1: Dependency Review
  # ========================================
  dependency-review:
    name: 🔍 Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@1769ed05b9f39e9906194499b5c2b0bf8535a69b
        with:
          fetch-depth: 0

      - name: 🔍 Review Dependencies
        uses: actions/dependency-review-action@3d8acb1c1d7a1f8e3b1c7d2e4f5a6b7c8d9e0f1a2
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  # ========================================
  # JOB 2: Signed Commits Verification
  # ========================================
  verify-signatures:
    name: 🔐 Verify Signed Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@1769ed05b9f39e9906194499b5c2b0bf8535a69b
        with:
          fetch-depth: 0

      - name: 🔐 Verify commit signatures
        run: |
          echo "Verifying commit signatures..."
          # Check if all commits in the range are signed
          COMMITS=$(git log --pretty=format:"%H" --no-merges ${{ github.event.before }}..${{ github.sha }} 2>/dev/null || git log --pretty=format:"%H" --no-merges -1 ${{ github.sha }})
          
          if [ -z "$COMMITS" ]; then
            echo "No new commits to verify"
            exit 0
          fi
          
          UNSIGNED=0
          for commit in $COMMITS; do
            if ! git verify-commit $commit 2>/dev/null; then
              echo "❌ Unsigned commit: $commit"
              git log -1 --format="%h %s (%an)" $commit
              UNSIGNED=1
            else
              echo "✅ Signed commit: $commit"
            fi
          done
          
          if [ $UNSIGNED -eq 1 ]; then
            echo ""
            echo "❌ Found unsigned commits. Please sign all commits with 'git commit -S'."
            exit 1
          fi
          
          echo "✅ All commits are signed"

  # ========================================
  # JOB 3: SBOM Generation (All Artifacts)
  # ========================================
  generate-sbom:
    name: 📦 Generate SBOMs (All Artifacts)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@1769ed05b9f39e9906194499b5c2b0bf8535a69b

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@dc9f519e47a8b796aa19d9a9e5a5f11b696d5e8c
        with:
          version: 9.15.4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f192cb99c9b2d8661c5e89
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📥 Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 📦 Generate all SBOMs
        run: node scripts/generate-sbom.js all

      - name: 📤 Upload SBOM artifacts
        uses: actions/upload-artifact@5d5d22a31266ced268874388604861cf4f7985a4
        with:
          name: sbom-all-artifacts
          path: sbom-output/
          retention-days: 30

  # ========================================
  # JOB 4: SLSA Provenance (Build Attestation)
  # ========================================
  slsa-provenance:
    name: 🏗️ SLSA Provenance (Build)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@1769ed05b9f39e9906194499b5c2b0bf8535a69b

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@dc9f519e47a8b796aa19d9a9e5a5f11b696d5e8c
        with:
          version: 9.15.4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f192cb99c9b2d8661c5e89
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📥 Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build all artifacts
        run: pnpm run build:monolith && pnpm build

      - name: 📋 Generate SLSA Provenance
        uses: slsa-framework/slsa-github-generator@main
        with:
          base64-subjects: ${{ toJson(format('{0}: {1}', github.repository, github.sha)) }}
          provenance-name: slsa-provenance.intoto.jsonl
          upload-assets: true

  # ========================================
  # JOB 5: SLSA Provenance (Release Attestation)
  # ========================================
  slsa-provenance-release:
    name: 📦 SLSA Provenance (Release)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: generate-sbom
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@1769ed05b9f39e9906194499b5c2b0bf8535a69b

      - name: 📥 Download SBOMs
        uses: actions/download-artifact@5d5d22a31266ced268874388604861cf4f7985a4
        with:
          name: sbom-all-artifacts
          path: sbom-output

      - name: 📦 Generate Release Provenance
        uses: slsa-framework/slsa-github-generator@main
        with:
          base64-subjects: ${{ toJson(format('{0}: {1}', github.repository, github.sha)) }}
          provenance-name: slsa-provenance-release.intoto.jsonl
          upload-assets: true

      - name: 📤 Upload Release Provenance
        uses: actions/upload-artifact@5d5d22a31266ced268874388604861cf4f7985a4
        with:
          name: slsa-release-provenance
          path: slsa-provenance-release.intoto.jsonl
          retention-days: 90

  # ========================================
  # JOB 6: Security Audit & Audit CI
  # ========================================
  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@1769ed05b9f39e9906194499b5c2b0bf8535a69b

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@dc9f519e47a8b796aa19d9a9e5a5f11b696d5e8c
        with:
          version: 9.15.4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f192cb99c9b2d8661c5e89
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📥 Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🛡️ Run pnpm audit
        run: pnpm audit --prod --json > audit-results.json || true

      - name: 📊 Upload Audit Results
        uses: github/codeql-action/upload-sarif@b30c9f6d23789413e5b8440c9e87604e87fe61c7
        if: always()
        with:
          sarif_file: audit-results.json
          category: pnpm-audit

      - name: 🔍 Run OSSF Scorecard
        uses: ossf/scorecard-action@0864cf195801925294d2a76a54d5f097c5e5f0d4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif

      - name: 📤 Upload Scorecard Results
        uses: github/codeql-action/upload-sarif@b30c9f6d23789413e5b8440c9e87604e87fe61c7
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
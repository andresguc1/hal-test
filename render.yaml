services:
  - type: web
    name: hal-test-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install && npm run build:monolith && (cd apps/backend && npx playwright install chromium)
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/playwright
      - key: DATABASE_URL
        sync: false

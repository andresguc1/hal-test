services:
  - type: web
    name: hal-test-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm build:monolith && npx playwright install chromium
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/playwright
      - key: DATABASE_URL
        sync: false

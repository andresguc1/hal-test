services:
  - type: web
    name: hal-test-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install && cd apps/backend && npx playwright install chromium
    startCommand: cd apps/backend && npm start
    preDeployCommand: cd apps/backend && npx playwright install chromium
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
